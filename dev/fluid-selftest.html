<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>fluid selftest</title>
  <style>body{margin:0;background:#0b1620;color:#dfe8ef;font:13px/1.5 ui-monospace,monospace;padding:16px}.ok{color:#7ef0c6}.ng{color:#ff6b6b}pre{white-space:pre-wrap}</style>
  <script type="importmap">
    { "imports": {
      "three": "../node_modules/three/build/three.webgpu.js",
      "three/webgpu": "../node_modules/three/build/three.webgpu.js",
      "three/tsl": "../node_modules/three/build/three.tsl.js",
      "three/addons/": "../node_modules/three/examples/jsm/"
    } }
  </script>
</head>
<body>
<h3>GPU 流体のセルフテスト（実際の船の格子で）</h3>
<pre id="out">実行中…</pre>
<script type="module">
// GPU 流体（src/gpu/fluid.js）を実際の船の格子で動かし、物理的に守るべき性質を確かめる。node では動かせないのでブラウザで実行する
import * as THREE from 'three/webgpu';
import * as V from '../src/voxel.js';
import * as Lo from '../src/layout.js';
import * as H from '../src/hull.js';
import * as F from '../src/flooding.js';
import { buildShipGrid, gridSpec, breachAt } from '../src/shipgrid.js';
import { createFluid, fluidParams, OPEN_INFLOW, OPEN_CLOSED, OPEN_OUTFLOW } from '../src/gpu/fluid.js';

const out = document.getElementById('out');
const log = (s, cls = '') => { out.innerHTML += `<span class="${cls}">${s}</span>\n`; };
out.textContent = '';
const results = [];
const check = (name, ok, detail) => { results.push({ name, ok, detail }); log(`${ok ? 'PASS' : 'FAIL'} ${name} — ${detail}`, ok ? 'ok' : 'ng'); };

const h = +(new URLSearchParams(location.search).get('h') ?? 0.5), PPC = 8, spec = gridSpec(h), Vp = h ** 3 / PPC; // 既定はアプリの標準画質
const Q0 = new URLSearchParams(location.search);
const { stiffness: k0, dtMax: dt0 } = fluidParams(h, PPC, { depth: H.D }); // アプリ（main.js）と同じ深さの剛性
const stiffness = k0 * +(Q0.get('kmul') ?? 1);
const dtMax = dt0 * +(Q0.get('cflmul') ?? 1) / Math.sqrt(+(Q0.get('kmul') ?? 1));
const R = (name) => Lo.ROOMS.findIndex((r) => r.name === name);
const allClosed = { doors: Object.fromEntries(Lo.DOORS.filter((d) => d.wt).map((d) => [d.id, false])), seaOpenings: Object.fromEntries(Lo.SEA_OPENINGS.map((o) => [o.id, false])) };

const renderer = new THREE.WebGPURenderer({ requiredLimits: { maxStorageBuffersPerShaderStage: 16 } });
await renderer.init();
if (Q0.has('only1')) window.ONLY1 = true;
if (!renderer.backend.isWebGPUBackend) { log('WebGPU が使えません', 'ng'); throw new Error('no webgpu'); }
const device = renderer.backend.device;
const qs = new URLSearchParams(location.search);
const fluid = createFluid(renderer, { dims: spec.dims, ppc: PPC, maxParticles: 393216, stiffness, ...(qs.has('mu') ? { viscosity: +qs.get('mu') } : {}), ...(qs.has('bulk') ? { bulkViscosity: +qs.get('bulk') } : {}) });

// 部屋 room の下から fraction の高さまで、格子点ごとに PPC 個の粒子を置く（格子座標）
function fillRoom(grid, room, fraction) {
  const ys = [];
  for (let n = 0; n < grid.N; n++) if (grid.type[n] === V.NODE_FLUID && grid.room[n] === room) ys.push(grid.coords(n)[1]);
  const y0 = Math.min(...ys), y1 = Math.max(...ys), top = y0 + (y1 - y0 + 1) * fraction;
  const pts = [];
  for (let n = 0; n < grid.N; n++) {
    if (grid.type[n] !== V.NODE_FLUID || grid.room[n] !== room) continue;
    const [i, j, k] = grid.coords(n);
    if (j >= top) continue;
    for (let a = 0; a < 2; a++) for (let b = 0; b < 2; b++) for (let c = 0; c < 2; c++) pts.push(i + 0.25 + a * 0.5, j + 0.25 + b * 0.5, k + 0.25 + c * 0.5);
  }
  return pts;
}
async function run(sec, { gravity = [0, -9.81, 0], spawns = () => [] } = {}) {
  const frames = Math.round(sec * 60), nSub = Math.ceil(1 / 60 / dtMax);
  for (let f = 0; f < frames; f++) {
    fluid.uniforms.gravity.value.set(...gravity).divideScalar(h);
    fluid.step(1 / 60 / nSub, nSub, spawns(f));
    if (f % 30 === 29) await device.queue.onSubmittedWorkDone();
  }
  await device.queue.onSubmittedWorkDone();
}
async function particles() {
  const p = new Float32Array(await renderer.getArrayBufferAsync(fluid.buffers.pos.value));
  const v = new Float32Array(await renderer.getArrayBufferAsync(fluid.buffers.vel.value));
  const list = [];
  for (let i = 0; i < p.length / 4; i++) if (p[4 * i + 3] > 0.5) list.push({ x: p[4 * i], y: p[4 * i + 1], z: p[4 * i + 2], s: Math.hypot(v[4 * i], v[4 * i + 1], v[4 * i + 2]) * h, vx: v[4 * i] * h, vy: v[4 * i + 1] * h, vz: v[4 * i + 2] * h, rho: v[4 * i + 3] });
  return list;
}
const roomOfP = (grid, p) => grid.room[grid.index(Math.floor(p.x), Math.floor(p.y), Math.floor(p.z))];
const countBy = (grid, ps) => { const c = new Map(); for (const p of ps) { const r = roomOfP(grid, p); c.set(r, (c.get(r) ?? 0) + 1); } return c; };
const nan = (ps) => ps.some((p) => !Number.isFinite(p.x + p.y + p.z + p.s));
const t0 = performance.now();

// ---------- 1) 静水: 前部機械室に 50% 入れて静置 → 漏れない・量が保存される・水面が平ら・静かになる ----------
{
  const b = buildShipGrid(h, allClosed);
  if (Q0.has('box')) {
    // 比較用: 平らな壁だけの箱（艦の格子の中の直方体 20×16×24）を第1缶室として使う
    b.grid.type.fill(V.NODE_EXTERIOR); b.grid.room.fill(V.NO_ROOM);
    for (let k = 140; k < 164; k++) for (let j = 2; j < 18; j++) for (let i = 2; i < 22; i++) {
      const n = b.grid.index(i, j, k);
      const wall = i === 2 || i === 21 || j === 2 || k === 140 || k === 163;
      b.grid.type[n] = wall ? V.NODE_SOLID : V.NODE_FLUID;
      b.grid.room[n] = wall ? V.NO_ROOM : R('第1缶室');
    }
  }
  fluid.setGrid(V.packForGpu(b.grid));
  const room = R(Q0.get('room') ?? '前部機械室');
  let pts = fillRoom(b.grid, room, +(Q0.get('fill') ?? 0.5));
  if (Q0.has('blob')) { // 壁に触れない水の塊（箱の中央）
    pts = [];
    for (let k = 146; k < 158; k++) for (let j = 6; j < 13; j++) for (let i = 7; i < 17; i++)
      for (let a = 0; a < 2; a++) for (let c = 0; c < 2; c++) for (let d = 0; d < 2; d++) pts.push(i + 0.25 + a * 0.5, j + 0.25 + c * 0.5, k + 0.25 + d * 0.5);
  }
  const G0 = Q0.has('grav0') ? [0, 0, 0] : [0, -9.81, 0];
  fluid.init(new Float32Array(pts));
  // 前半 10 秒で落ち着かせ、後半 3 秒は 0.25 秒ごとに水の重心の高さを見る（目に見える揺れ = 重心の上下）
  await run(+(Q0.get('settle') ?? 10), { gravity: G0 });
  const comY = [];
  for (let t = 0; t < 12; t++) {
    await run(0.25, { gravity: G0 });
    const q = await particles();
    comY.push(q.reduce((a, p) => a + p.y, 0) / q.length);
  }
  const swing = (Math.max(...comY) - Math.min(...comY)) * h;
  if (Q0.has('trace')) {
    const q = await particles();
    const fast = [...q].sort((a, c) => c.s - a.s).slice(0, 12).map((p) => {
      const [lx, ly, lz] = b.grid.toLocal(p.x, p.y, p.z);
      const n = b.grid.index(Math.floor(p.x), Math.floor(p.y), Math.floor(p.z));
      return `(${lx.toFixed(2)},${ly.toFixed(2)},${lz.toFixed(2)}) ${p.s.toFixed(1)}m/s v=(${p.vx.toFixed(1)},${p.vy.toFixed(1)},${p.vz.toFixed(1)}) ρ=${p.rho.toFixed(2)} t=${b.grid.type[n]}`;
    });
    log('最速の粒子:' + String.fromCharCode(10) + '  ' + fast.join(String.fromCharCode(10) + '  '));
    // 速い粒子（> 2 m/s）の分布: 船体座標の 1 m 刻みの箱ごとの数
    const hist = new Map();
    for (const p of q) if (p.s > 2) { const [lx, ly, lz] = b.grid.toLocal(p.x, p.y, p.z); const key = [Math.round(lx), Math.round(ly), Math.round(lz)].join(','); hist.set(key, (hist.get(key) ?? 0) + 1); }
    log('速い粒子の場所（x,y,z → 個数）: ' + [...hist].sort((a, c) => c[1] - a[1]).slice(0, 15).map(([k, v]) => `${k}:${v}`).join(' '));
  }
  window.worst = swing;
  const ps = await particles();
  const cnt = countBy(b.grid, ps);
  check('静水: 粒子が消えない', ps.length === pts.length / 3, `${ps.length} / ${pts.length / 3}`);
  check('静水: 他の部屋に漏れない', [...cnt.keys()].every((r) => r === room || r === V.NO_ROOM), JSON.stringify([...cnt]));
  const gpuRooms = fluid.stats.roomMass;
  check('静水: GPU の部屋ごとの集計がほぼ全粒子をその部屋に数える（水位計算の元、誤差 0.5% 未満）', gpuRooms[room] > ps.length * 0.995, `部屋 ${gpuRooms[room]} / 全 ${ps.length}、部屋なし ${gpuRooms[V.NO_ROOM]}`);
  // 実際の体積（空気の体積の元）: 縮んだ分だけ粒子数より少なく、しかし弱圧縮の範囲（水深 ~2 m で数 %）を超えて少なくない。
  // 粒子数より多いなら、壁際・水面の低い密度比で割っている（小さな部屋で浸水率が 142% になった不具合の再発）
  const vol = fluid.stats.roomVolume[room] + fluid.stats.roomVolume[V.NO_ROOM];
  check('静水: GPU の部屋ごとの実際の体積は粒子数以下で、縮みは 10% 未満', vol <= ps.length * 1.001 && vol > ps.length * 0.9, `体積 ${vol.toFixed(0)} / 粒子 ${ps.length}（静止体積 = 1）`);
  check('静水: NaN が無い', !nan(ps), '');
  const ys = ps.map((p) => p.y).sort((a, b) => a - b);
  const top = ys[Math.floor(ys.length * 0.995)];
  const level = (F.waterLevel(F.roomNodes(b.grid, Lo.ROOMS.length)[room], h, ps.length * Vp, [0, 1, 0]) - spec.origin[1]) / h; // 格子座標
  // 弱圧縮性なので水面は水量どおりより少し低い（設計の圧縮率は水深 5 m で 12%）
  check('静水: 水面の高さが水量に見合う（圧縮 15% 以内）', top < level + 1.0 && top > level - (level - 3) * 0.15 - 1.0, `上端 ${top.toFixed(2)} / 期待 ${level.toFixed(2)}（格子単位）`);
  check('静水: 落ち着く（後半 3 秒の水の重心の上下が 5 cm 未満）', swing < 0.05, `重心の上下 ${(swing * 100).toFixed(1)} cm、粒子の速さの中央値 ${[...ps].map((p) => p.s).sort((a, c) => a - c)[ps.length >> 1].toFixed(2)} m/s`);
  // 水面の平らさ: 上から 3% の粒子の高さの幅
  const surf = ys.slice(Math.floor(ys.length * 0.97));
  check('静水: 水面が平ら（上端のばらつき < 1.5 セル）', surf.at(-1) - surf[0] < 1.5, `${(surf.at(-1) - surf[0]).toFixed(2)} セル`);
}

if (window.ONLY1) { window.done = true; throw new Error('only1'); }
// ---------- 1b) 発散しない: 缶の角と薄い水の層がある第1缶室で 20 秒 ----------
// （粘性の項に実際の体積 1/ρ を使っていたときは、水面の低密度の粒子から発散して 20 秒で全体が 30 m/s になった）
{
  const b = buildShipGrid(h, allClosed);
  fluid.setGrid(V.packForGpu(b.grid));
  const room = R('第1缶室');
  const pts = fillRoom(b.grid, room, 0.4);
  fluid.init(new Float32Array(pts));
  await run(20);
  const ps = await particles();
  const sp = ps.map((p) => p.s).sort((a, c) => a - c);
  check('安定: 20 秒後も発散しない（速さの中央値 < 1 m/s、最大 < 15 m/s）', sp[sp.length >> 1] < 1 && sp.at(-1) < 15 && !nan(ps), `中央値 ${sp[sp.length >> 1].toFixed(2)} / 最大 ${sp.at(-1).toFixed(1)} m/s`);
}
// ---------- 2) 水密: 後部弾薬庫を 70% にして 25° 傾けた重力で隔壁に押し付ける → 隣へ漏れない ----------
{
  const b = buildShipGrid(h, allClosed);
  fluid.setGrid(V.packForGpu(b.grid));
  const room = R('後部弾薬庫');
  const pts = fillRoom(b.grid, room, 0.7);
  fluid.init(new Float32Array(pts));
  const a = 25 * Math.PI / 180;
  await run(4, { gravity: [0, -9.81 * Math.cos(a), 9.81 * Math.sin(a)] });
  await run(4, { gravity: [0, -9.81 * Math.cos(a), -9.81 * Math.sin(a)] });
  const ps = await particles();
  const cnt = countBy(b.grid, ps);
  // 同じ水密区画の部屋（揚弾口でつながる士官室）へ行くのは正しい。別の区画へ出たら漏れ
  const comp = Lo.ROOMS[room].comp;
  const leaked = [...cnt].filter(([r]) => r !== V.NO_ROOM && Lo.ROOMS[r].comp !== comp).reduce((s, [, n]) => s + n, 0);
  check('水密: 傾けても別の水密区画に漏れない', leaked === 0, JSON.stringify([...cnt]));
  check('水密: 粒子が消えない', ps.length === pts.length / 3, `${ps.length} / ${pts.length / 3}`);
}

// ---------- 3) 扉: 前部機械室に水、D3（前部↔後部機械室）を開ける → 両室の水位がそろう ----------
// 格子 0.5 m では扉のような細い開口の流れが、せきの流量式の見積もりの 1/3〜1/4 と遅い（流量は扉の幅に比例する: 幅 1.0 / 1.6 / 2.6 m で
// 10 秒に 603 / 1083 / 1758 粒子。粘性を 1/10 にしても変わらない）。機械室は床面積 ~80 m² と広いので、そろうまで 60 秒みる。
// 水位は粒子の上端ではなく部屋の水量から求める（3b と同じ。機器の塊の上に残る薄い水や水しぶきで上端がぶれない）
{
  const b = buildShipGrid(h, { ...allClosed, doors: { ...allClosed.doors, D3: true } });
  fluid.setGrid(V.packForGpu(b.grid));
  const er = R('前部機械室'), sg = R('後部機械室');
  const nodes = F.roomNodes(b.grid, Lo.ROOMS.length);
  const n0 = fillRoom(b.grid, er, 0.28).length / 3;
  fluid.init(new Float32Array(fillRoom(b.grid, er, 0.28)));
  await run(+(Q0.get('doorT') ?? 60));
  const ps = await particles();
  const cnt = countBy(b.grid, ps);
  const lv = (r) => F.waterLevel(nodes[r], h, (cnt.get(r) ?? 0) * Vp, [0, 1, 0]);
  const d = Math.abs(lv(er) - lv(sg));
  check('扉: 開いた水密扉を通って隣室へ流れ、水位がそろう（差 < 0.3 m）', d < 0.3 && (cnt.get(sg) ?? 0) > n0 * 0.3, `前部機械室 ${lv(er).toFixed(2)} / 後部機械室 ${lv(sg).toFixed(2)} m（${cnt.get(er) ?? 0} / ${cnt.get(sg) ?? 0} 粒子）`);
}

// ---------- 3b) 空気圧: 同じ扉で、後部機械室の空気だけ 0.6 m 水頭だけ高い → 後部機械室の水面が 0.6 m 低いところで釣り合う ----------
{
  const b = buildShipGrid(h, { ...allClosed, doors: { ...allClosed.doors, D3: true } });
  fluid.setGrid(V.packForGpu(b.grid));
  const er = R('前部機械室'), sg = R('後部機械室');
  const nodes = F.roomNodes(b.grid, Lo.ROOMS.length);
  const H0 = +(Q0.get('airh') ?? 0.6);
  let nInit = 0;
  // 水位は部屋の粒子数（圧縮なしの体積）から求める。アプリは圧縮を割り戻した体積（stats.roomVolume）を使うが、ここでは
  // 段差なし（head = 0）の水位差を引いて比べるので、縮みの分の偏りは打ち消される
  const levelDiff = async (head) => {
    const heads = new Array(V.MAX_ROOMS).fill(0);
    heads[sg] = head;
    fluid.setRoomHeads(heads, h);
    // 両室を同じ高さ（船体座標 y = 2.2 m、扉の途中）まで満たして始める（釣り合いに要る移動を小さくし、狭い扉越しの流れを待たずに済む）
    const pts = [];
    for (let n = 0; n < b.grid.N; n++) {
      if (b.grid.type[n] !== V.NODE_FLUID || (b.grid.room[n] !== er && b.grid.room[n] !== sg)) continue;
      const [i, j, k] = b.grid.coords(n);
      if (b.grid.pos(i, j, k)[1] > 2.2) continue;
      for (let a = 0; a < 2; a++) for (let c = 0; c < 2; c++) for (let e = 0; e < 2; e++) pts.push(i + 0.25 + a * 0.5, j + 0.25 + c * 0.5, k + 0.25 + e * 0.5);
    }
    nInit = pts.length / 3;
    fluid.init(new Float32Array(pts));
    await run(+(Q0.get('airT') ?? 40));
    const ps = await particles();
    const cnt = countBy(b.grid, ps);
    const lv = (r) => F.waterLevel(nodes[r], h, (cnt.get(r) ?? 0) * Vp, [0, 1, 0]);
    return { d: lv(er) - lv(sg), er: lv(er), sg: lv(sg), ps };
  };
  const base = await levelDiff(0), r = await levelDiff(H0);
  const d = r.d - base.d;
  check(`空気圧: 扉の向こうの空気が ${H0} m 水頭だけ高いと、そちらの水面がその分低い（±25%）`, Math.abs(d - H0) < 0.25 * H0 && !nan(r.ps), `水位差 ${r.d.toFixed(2)} m − 段差なし ${base.d.toFixed(2)} m = ${d.toFixed(2)} m（前部機械室 ${r.er.toFixed(2)} / 後部機械室 ${r.sg.toFixed(2)}）`);
  check('空気圧: 粒子が消えない', r.ps.length === nInit, `${r.ps.length} / ${nInit}`);
  fluid.setRoomHeads(new Array(V.MAX_ROOMS).fill(0), h);
}

// ---------- 4) 流入: 空の艦に破口 → 生成した分だけ粒子が増え、破口の部屋に溜まる ----------
{
  const bb = breachAt(5, 3.0, 7.5, 1.6, 1.2); // 第2缶室の舷側
  const b = buildShipGrid(h, { ...allClosed, breaches: [bb] });
  fluid.setGrid(V.packForGpu(b.grid));
  fluid.init(new Float32Array(0));
  const o = b.openings[0];
  const toG = (p) => [(p[0] - spec.origin[0]) / h, (p[1] - spec.origin[1]) / h, (p[2] - spec.origin[2]) / h];
  const vel = o.normal.map((c) => (-c * 4) / h);
  fluid.setOpening(0, { mode: OPEN_INFLOW, inflow: vel, center: toG(o.spawn.center), ax: o.spawn.ax.map((c) => c / h), ay: o.spawn.ay.map((c) => c / h), spawnVel: vel });
  let spawned = 0;
  await run(8, { spawns: () => { spawned += 60; return [{ opening: 0, count: 60 }]; } });
  fluid.setOpening(0, { mode: OPEN_CLOSED });
  await run(2);
  const ps = await particles();
  const cnt = countBy(b.grid, ps);
  const st = fluid.stats;
  check('流入: 生成した数 = 生きている粒子 + 船外へ出た粒子', ps.length + (st?.killed ?? 0) === spawned, `生成 ${spawned}, 生存 ${ps.length}, 船外 ${st?.killed}`);
  check('流入: 船外へ出たのは 2% 未満（噴流が船内に入る）', (st?.killed ?? 0) < spawned * 0.02, `${st?.killed}`);
  check('流入: 破口の部屋に溜まる', (cnt.get(o.room) ?? 0) > ps.length * 0.95, JSON.stringify([...cnt]));
}

// ---------- 5) 流出: 破口の上まで水がある部屋で、魚雷の大きさの破口（5 × 3 m）を流出（外向き 2 m/s）にする → 開口の面積 × 速さ に見合って出ていく ----------
// 格子 0.5 m では、開口を通って格子が運べる量は与えた速さ × 面積の 25〜50%（開口が小さいほど少ない。1.6 × 1.2 m で 22%、5 × 3 m で 49%）。
// 扉の流れが遅いのと同じ解像度の限界。流入は粒子を数えて作るので正確で、流出だけが少なめになる
{
  const bb = breachAt(5, 3.0, 7.5, 5, 3); // 第2缶室の舷側、高さ 1.5〜4.5 m
  const b = buildShipGrid(h, { ...allClosed, breaches: [bb] });
  fluid.setGrid(V.packForGpu(b.grid));
  const o = b.openings[0];
  const pts = [];
  for (let n = 0; n < b.grid.N; n++) {
    if (b.grid.type[n] !== V.NODE_FLUID || b.grid.room[n] !== o.room) continue;
    const [i, j, k] = b.grid.coords(n);
    if (b.grid.pos(i, j, k)[1] > 5.5) continue; // 破口の上端より 1 m 上まで
    for (let a = 0; a < 2; a++) for (let c = 0; c < 2; c++) for (let e = 0; e < 2; e++) pts.push(i + 0.25 + a * 0.5, j + 0.25 + c * 0.5, k + 0.25 + e * 0.5);
  }
  fluid.init(new Float32Array(pts));
  fluid.setOpening(0, { mode: OPEN_CLOSED });
  await run(2); // 落ち着かせる（閉じたまま）
  const k0 = fluid.stats?.killed ?? 0, SPEED = 2, T = 3;
  const vel = o.normal.map((c) => (c * SPEED) / h);
  fluid.setOpening(0, { mode: OPEN_OUTFLOW, inflow: vel, spawnVel: vel });
  await run(T);
  fluid.setOpening(0, { mode: OPEN_CLOSED });
  await run(0.5);
  const out = ((fluid.stats?.killed ?? 0) - k0) * Vp, expect = o.area * SPEED * T;
  const ps = await particles();
  check('流出: 外向きの速さ × 開口の面積 × 時間 に見合う水が出ていく（格子 0.5 m の解像度で 30〜120%）', out > expect * 0.3 && out < expect * 1.2, `出た水 ${out.toFixed(1)} m³ / 目安 ${expect.toFixed(1)} m³`);
  check('流出: 閉じた後は出ていかず、粒子の数が合い、NaN も無い', !nan(ps) && ps.length + Math.round(out / Vp) === pts.length / 3, `残り ${ps.length} + 出た ${Math.round(out / Vp)} = ${pts.length / 3}`);
}

log(`\n所要 ${((performance.now() - t0) / 1000).toFixed(1)} s`);
window.results = results;
window.done = true;
</script>
