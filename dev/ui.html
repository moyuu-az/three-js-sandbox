<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>ui check</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>body{background:#0c1a24}</style>
</head>
<body>
  <section class="diagram glass" style="top:12px;height:auto;bottom:auto;height:260px">
    <div class="diagram-head">
      <div class="group-title">区画の浸水状況</div>
      <div class="legend"><span class="sw water"></span>水 <span class="sw door"></span>水密扉（クリックで開閉） <span class="sw breach"></span>破口</div>
    </div>
    <svg id="profile" preserveAspectRatio="xMidYMid meet"></svg>
  </section>
<script type="module">
// 開発用: 区画図をダミーデータで描く
import { createProfile } from '../src/ui/profile.js';
import * as Lo from '../src/layout.js';
import { breachAt } from '../src/shipgrid.js';
const states = { D1: true, D2: false, D3: false, o1: true, o2: true, o3: true, o4: false, o5: true };
const p = createProfile(document.getElementById('profile'), { onDoor: (id) => { states[id] = !states[id]; draw(); } });
const fills = Lo.ROOMS.map((r, i) => [0.1, 0.8, 0.45, 0.3, 0.6, 0, 0.2, 1, 0.05, 0.9, 0, 0.15, 0][i]);
function draw() { p.update({ fills, hot: fills.map((f) => f > 0.5), waterline: [2.4, 3.1], doorStates: states, breaches: [breachAt(3.5, 1.8, 7.8, 1.6, 1.2)] }); }
draw();
</script>
</body>
</html>
